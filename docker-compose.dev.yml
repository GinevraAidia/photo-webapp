services:
  frontend:
    build: 
      context: frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src:ro
    environment:
      - CHOKIDAR_USEPOLLING=${OS:+true}
  backend:
    build: 
      context: backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
      - "5678:5678"
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - media_data:/app/media #volume for media files
    environment:
      - WAIT_FOR_DEBUGGER=False  # Set to True to wait for debugger
      - PYDEVD_DISABLE_FILE_VALIDATION=1
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
  db:
    image: postgres:18
    container_name: postgres-dev
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
  media_data: